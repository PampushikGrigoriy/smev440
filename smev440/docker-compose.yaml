services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  neo4j:
    image: neo4j:5.15
    container_name: foiv-neo4j
    environment:
      NEO4J_AUTH: neo4j/password123  
      NEO4J_PLUGINS: '["apoc"]'  
    ports:
      - "7474:7474"  # Web UI
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs  # Добавлены логи
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password123 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  prefect-server:
    image: prefecthq/prefect:sha-8b1eae4-python3.14
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@postgres:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_PORT: 4200
      PREFECT_UI_PORT: 4200
      PREFECT_SERVER_UI_API_URL: http://localhost:4200/api
      PREFECT_SERVER_LOGGING_LEVEL: WARNING
      PREFECT_API_SERVICES_SCHEDULER_ENABLED: "true"
      PREFECT_API_SERVICES_LATE_RUNS_ENABLED: "true"
    command: prefect server start 
    ports:
      - "192.168.1.231:4200:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  fns-deploy:
    image: prefecthq/prefect:sha-8b1eae4-python3.14
    restart: "no"
    command: >
      sh -c "
        echo 'Waiting for Prefect Server...' &&
        sleep 10 &&
        
        echo '✓ Creating work pool and deploying flows from prefect.yaml...' &&
        prefect deploy --all &&
        
        echo '✓ Deployment completed successfully!' &&
        echo '✓ Work pool: smev-fns' &&
        echo '✓ Flows deployed:' &&
        prefect deployment ls
      "
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    volumes:
      - ./flows:/app/src/flows  # монтируем код флоу
      - ./prefect.yaml:/app/prefect.yaml  # монтируем конфиг
    working_dir: /app
    depends_on:
      prefect-server:
        condition: service_healthy

  fns-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      - PYTHONUNBUFFERED=1
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASS=password123      
    volumes:
      - ./flows:/src/flows
      - .:/app
      - gate_share:/app/gate_share
      - abs_share:/app/abs_share
    working_dir: /app
    command: >
      sh -c "
        prefect worker start --pool smev-fns --name fns-docker-worker --limit 100
      "
    depends_on:
      prefect-server:
        condition: service_healthy
      fns-deploy:
        condition: service_completed_successfully

volumes:
  postgres_data:
  neo4j_data:

